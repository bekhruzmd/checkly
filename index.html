<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkly — Kiosk Check In</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0B0F17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F17;
    --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f17 80%);
    --surface: rgba(22, 27, 34, 0.75);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --pass: #10b981;
    --pass-glow: rgba(16, 185, 129, 0.25);
    --fail: #ef4444;
    --fail-glow: rgba(239, 68, 68, 0.25);
    --warn: #f59e0b;

    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header Nav ── */
  header {
    width: 100%; max-width: 520px;
    padding: 20px 20px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 32px; width: auto; filter: drop-shadow(0 0 10px rgba(59,130,246,0.3)); }
  .nav-links { display: flex; gap: 12px; }
  .nav-link {
    font-family: var(--font-display);
    font-size: 12px; font-weight: 600;
    color: var(--muted); text-decoration: none;
    padding: 6px 12px; border-radius: 8px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .nav-link:hover { color: var(--text); border-color: var(--border-strong); }

  /* ── Container ── */
  main {
    width: 100%; max-width: 440px;
    padding: 24px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  .title-group { text-align: center; margin-bottom: 4px; }
  h1 { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  #shiftStatus {
    font-size: 13px; color: var(--muted); font-family: var(--font-mono); margin-top: 4px;
    background: rgba(30, 41, 59, 0.4); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
    display: inline-block;
  }

  /* ── Camera Viewfinder Container ── */
  .cam-card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 16px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(59,130,246,0.15);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    position: relative;
  }

  .cam-wrap {
    position: relative; width: 100%;
    aspect-ratio: 4/3; max-height: 280px;
    border-radius: 14px; overflow: hidden; background: #000;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    border: 1px solid var(--border);
  }
  video { width: 100%; height: 100%; display: block; object-fit: cover; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  .status-pills {
    display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%;
  }

  #faceHint {
    font-size: 13px; font-weight: 600; color: var(--muted);
    min-height: 22px; text-align: center; transition: color 0.3s;
    display: flex; align-items: center; gap: 6px;
  }
  #faceHint.ready { color: var(--pass); text-shadow: 0 0 10px var(--pass-glow); }

  #locNote {
    font-size: 12px; color: var(--muted); font-family: var(--font-mono);
  }

  #captureBtn {
    width: 100%; padding: 14px 28px;
    font-family: var(--font-display); font-size: 15px; font-weight: 700;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #fff; cursor: pointer;
    box-shadow: 0 6px 20px var(--accent-glow);
    transition: all 0.2s ease;
  }
  #captureBtn:hover:not(:disabled) {
    background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
    box-shadow: 0 8px 24px var(--accent-glow);
    transform: translateY(-1px);
  }
  #captureBtn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  #status {
    margin-top: 8px; font-size: 14px; font-weight: 600;
    text-align: center; min-height: 24px; padding: 8px 16px; border-radius: 10px;
    width: 100%;
  }
  #status.late   { background: rgba(239, 68, 68, 0.15); color: var(--fail); border: 1px solid rgba(239, 68, 68, 0.3); }
  #status.ontime { background: rgba(16, 185, 129, 0.15); color: var(--pass); border: 1px solid rgba(16, 185, 129, 0.3); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <picture>
      <source srcset="logo-light.png" media="(prefers-color-scheme: light)">
      <img src="logo-dark.png" alt="Checkly">
    </picture>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="worker-dashboard.html">My Portal</a>
    <a class="nav-link" href="admin.html">Admin</a>
  </div>
</header>

<main>
  <div class="title-group">
    <h1>Biometric Check-In</h1>
    <div id="shiftStatus">Morning shift · 09:00 – 17:00</div>
  </div>

  <div class="cam-card">
    <div class="cam-wrap">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="status-pills">
      <div id="faceHint">Initializing facial detection system…</div>
      <div id="locNote">Checking GPS geofence location…</div>
    </div>

    <canvas id="capture" style="display:none"></canvas>
    <button id="captureBtn" disabled>Capture & Verify</button>
    <div id="status"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';

const DEMO_STATES = [
  { ok: true,  data: { worker_name: 'Alisher Nazarov', event_type: 'check_in',  minutes_late: 0,  fee_charged: 0, checkin_time: '09:02' } },
  { ok: true,  data: { worker_name: 'Alisher Nazarov', event_type: 'check_in',  minutes_late: 12, fee_charged: 6.00, checkin_time: '09:12' } },
  { ok: true,  data: { worker_name: 'Alisher Nazarov', event_type: 'check_out', minutes_late: null, fee_charged: 0, checkout_time: '17:01' } },
  { ok: false, data: { detail: "Face not recognized. Position clearly or contact your manager." } },
];
let demoIdx = 0;

const video     = document.getElementById('cam');
const overlay   = document.getElementById('overlay');
const capture   = document.getElementById('capture');
const btn       = document.getElementById('captureBtn');
const statusEl  = document.getElementById('status');
const shiftEl   = document.getElementById('shiftStatus');
const hintEl    = document.getElementById('faceHint');
const locNote   = document.getElementById('locNote');
const ctx       = overlay.getContext('2d');

let currentPosition = null;
let faceReady = false;
let scanning = false;

navigator.geolocation.watchPosition(
  pos => {
    currentPosition = pos;
    locNote.textContent = `📍 GPS Location Verified (±${Math.round(pos.coords.accuracy)}m)`;
  },
  () => { locNote.textContent = '⚠️ Location permission required for geofencing.'; },
  { enableHighAccuracy: true, maximumAge: 5000 }
);

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
  .then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      overlay.width  = video.videoWidth;
      overlay.height = video.videoHeight;
      loadFaceModel();
    };
  })
  .catch(() => { hintEl.textContent = '⚠️ Camera permission needed to check in.'; });

async function loadFaceModel() {
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    hintEl.textContent = 'Center your face in the camera frame';
    detectLoop();
  } catch {
    hintEl.textContent = 'Ready to check in';
    btn.textContent = 'Capture & Verify';
    btn.disabled = false;
  }
}

function drawBrackets(box, color) {
  const { x, y, width: w, height: h } = box;
  const L = Math.min(w, h) * 0.2;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + L, y);       ctx.lineTo(x, y);       ctx.lineTo(x, y + L);
  ctx.moveTo(x+w-L, y);       ctx.lineTo(x+w, y);     ctx.lineTo(x+w, y + L);
  ctx.moveTo(x + L, y+h);     ctx.lineTo(x, y+h);     ctx.lineTo(x, y+h-L);
  ctx.moveTo(x+w-L, y+h);     ctx.lineTo(x+w, y+h);   ctx.lineTo(x+w, y+h-L);
  ctx.stroke();
  ctx.restore();
}

async function detectLoop() {
  if (video.paused || video.ended) return;
  const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224 }));
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  if (detection) {
    drawBrackets(detection.box, '#10b981');
    if (!faceReady) {
      faceReady = true;
      hintEl.textContent = '✓ Face aligned. Tap to submit.';
      hintEl.classList.add('ready');
      btn.disabled = false;
    }
  } else {
    faceReady = false;
    hintEl.textContent = 'Center your face in the camera frame';
    hintEl.classList.remove('ready');
    btn.disabled = true;
  }
  requestAnimationFrame(detectLoop);
}

btn.addEventListener('click', async () => {
  if (scanning) return;
  scanning = true;
  btn.disabled = true;
  btn.textContent = 'Verifying Face Embedding…';
  statusEl.className = '';
  statusEl.textContent = '';

  const canvas = capture;
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);

  setTimeout(() => {
    const state = DEMO_STATES[demoIdx % DEMO_STATES.length];
    demoIdx++;
    scanning = false;
    btn.disabled = !faceReady;
    btn.textContent = 'Capture & Verify';

    if (state.ok) {
      const d = state.data;
      sessionStorage.setItem('checklyWorker', JSON.stringify(d));
      if (d.event_type === 'check_in') {
        const isLate = d.minutes_late > 0;
        statusEl.className = isLate ? 'late' : 'ontime';
        statusEl.textContent = isLate
          ? `Checked In — ${d.minutes_late}m late ($${d.fee_charged.toFixed(2)} fee)`
          : `✓ Checked In On Time (${d.worker_name})`;
        shiftEl.textContent = `Today: Checked in at ${d.checkin_time || '09:02'}`;
      } else {
        statusEl.className = 'ontime';
        statusEl.textContent = `✓ Checked Out (${d.worker_name})`;
        shiftEl.textContent = `Today: Shift complete`;
      }
      setTimeout(() => window.location.href = 'worker-dashboard.html', 1500);
    } else {
      statusEl.className = 'late';
      statusEl.textContent = state.data.detail;
    }
  }, 900);
});
</script>
</body>
</html>
