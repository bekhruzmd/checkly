<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Checkly — Attendance Kiosk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#111318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #111318;
  --paper:     #F7F7F5;
  --surface:   #ffffff;
  --raised:    #F0F1F3;
  --muted:     #747983;
  --line:      #E3E5E8;
  --blue:      #4169E1;
  --green:     #1F9D68;
  --green-bg:  #EAF7F1;
  --amber:     #C98A18;
  --amber-bg:  #FDF6EA;
  --red:       #D94B4B;
  --red-bg:    #FDF0F0;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink:       #F7F7F5;
    --paper:     #111318;
    --surface:   #1A1D24;
    --raised:    #232730;
    --muted:     #8E94A0;
    --line:      #2A2E38;
    --green-bg:  rgba(31, 157, 104, 0.15);
    --amber-bg:  rgba(201, 138, 24, 0.15);
    --red-bg:    rgba(217, 75, 75, 0.15);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 32px 24px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Kiosk Header ── */
header {
  width: 100%; max-width: 560px;
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 32px; width: auto; }
.header-clock { text-align: right; }
.time-main { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--ink); }
.date-sub { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ── Main Container ── */
main {
  width: 100%; max-width: 520px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  margin: auto 0; gap: 24px;
}

.greeting-title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.greeting-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

/* ── Camera Frame ── */
.cam-container {
  position: relative; width: 280px; height: 280px;
  border-radius: 50%; padding: 8px;
  background: var(--surface);
  border: 2px solid var(--line);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.3s ease;
}
.cam-container.detecting { border-color: var(--blue); }
.cam-container.recognized { border-color: var(--green); }
.cam-container.rejected { border-color: var(--red); }

.cam-frame {
  width: 100%; height: 100%; border-radius: 50%;
  overflow: hidden; background: #000; position: relative;
}
video { width: 100%; height: 100%; object-fit: cover; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

.status-instruction {
  font-size: 15px; font-weight: 500; color: var(--muted);
  min-height: 24px; transition: color 0.2s ease;
}
.status-instruction.ready { color: var(--ink); font-weight: 600; }
.status-instruction.error { color: var(--red); font-weight: 600; }

/* Divider & Alternative ID Check-in */
.divider-row {
  display: flex; align-items: center; gap: 16px; width: 100%; max-width: 380px;
  color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
}
.divider-line { flex: 1; height: 1px; background: var(--line); }

.id-card-btn {
  width: 100%; max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: all 0.15s ease;
  color: var(--ink); font-family: var(--font-sans); font-size: 14px; font-weight: 500;
}
.id-card-btn:hover { background: var(--raised); border-color: var(--muted); }
.id-card-btn:active { transform: scale(0.99); }
.id-btn-left { display: flex; align-items: center; gap: 12px; }
.id-icon { font-size: 18px; color: var(--blue); }

/* ── Success Recognition Card ── */
.result-card {
  position: absolute; inset: 0;
  background: var(--surface);
  border-radius: 50%;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center; gap: 8px;
  animation: fadeIn 0.25s ease-out;
  z-index: 10;
}
.result-card.active { display: flex; }
.result-icon {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700; margin-bottom: 4px;
}
.result-icon.success { background: var(--green-bg); color: var(--green); }
.result-icon.fail    { background: var(--red-bg);   color: var(--red); }
.result-title { font-size: 17px; font-weight: 600; color: var(--ink); }
.result-time  { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.result-sub   { font-size: 13px; color: var(--muted); }

/* ── Footer ── */
footer {
  width: 100%; max-width: 560px;
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 16px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}
footer a { color: var(--muted); text-decoration: none; font-weight: 500; }
footer a:hover { color: var(--ink); }

@keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <picture>
      <source srcset="logo-light.png" media="(prefers-color-scheme: light)">
      <img src="logo-dark.png" alt="Checkly">
    </picture>
  </div>
  <div class="header-clock">
    <div class="time-main" id="clockTime">08:42 AM</div>
    <div class="date-sub" id="clockDate">MON, AUG 25</div>
  </div>
</header>

<main>
  <div>
    <h1 class="greeting-title">Good morning.</h1>
    <p class="greeting-sub">Check in for your shift</p>
  </div>

  <div class="cam-container" id="camContainer">
    <div class="cam-frame">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>

      <!-- Success / Failure Overlay -->
      <div class="result-card" id="resultCard">
        <div class="result-icon success" id="resultIcon">✓</div>
        <div class="result-title" id="resultTitle">Checked in</div>
        <div class="result-time" id="resultTime">08:42 AM</div>
        <div class="result-sub" id="resultSub">Morning shift</div>
      </div>
    </div>
  </div>

  <div class="status-instruction" id="statusInstruction">Look at the camera</div>

  <div class="divider-row">
    <div class="divider-line"></div>
    <span>OR</span>
    <div class="divider-line"></div>
  </div>

  <button class="id-card-btn" id="idCheckinBtn">
    <div class="id-btn-left">
      <span class="id-icon">▣</span>
      <div style="text-align:left">
        <div>Use Employee ID</div>
        <div style="font-size:12px;color:var(--muted)">Tap your ID card or enter number</div>
      </div>
    </div>
    <span style="color:var(--muted)">›</span>
  </button>
</main>

<footer>
  <span>Privacy first · Secure attendance</span>
  <a href="admin.html">Admin Dashboard</a>
</footer>

<canvas id="capture" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
const API_BASE  = localStorage.getItem('API_BASE') || 'http://localhost:8000';

const video             = document.getElementById('cam');
const overlay           = document.getElementById('overlay');
const capture           = document.getElementById('capture');
const camContainer      = document.getElementById('camContainer');
const statusInstruction = document.getElementById('statusInstruction');
const resultCard        = document.getElementById('resultCard');
const resultIcon        = document.getElementById('resultIcon');
const resultTitle       = document.getElementById('resultTitle');
const resultTime        = document.getElementById('resultTime');
const resultSub         = document.getElementById('resultSub');
const ctx               = overlay.getContext('2d');

let currentPosition = { latitude: 41.311082, longitude: 69.240562 };
let faceReady = false;
let processing = false;
let cooldown = false;
let autoCheckTimer = null;

// Clock updates
function updateClock() {
  const now = new Date();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('clockDate').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
}
setInterval(updateClock, 1000);
updateClock();

// Geolocation
navigator.geolocation.watchPosition(
  pos => { currentPosition = { latitude: pos.coords.latitude, longitude: pos.coords.longitude }; },
  () => {},
  { enableHighAccuracy: true, maximumAge: 5000 }
);

// Camera Init
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
  .then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      overlay.width  = video.videoWidth;
      overlay.height = video.videoHeight;
      loadFaceModel();
    };
  })
  .catch(() => {
    statusInstruction.textContent = 'Camera permission required for kiosk';
    statusInstruction.className = 'status-instruction error';
  });

async function loadFaceModel() {
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    statusInstruction.textContent = 'Look at the camera';
    detectLoop();
  } catch {
    statusInstruction.textContent = 'Hold face steady';
  }
}

async function detectLoop() {
  if (video.paused || video.ended) return;
  const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224 }));
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  if (detection && !cooldown && !processing) {
    camContainer.className = 'cam-container detecting';
    if (!faceReady) {
      faceReady = true;
      statusInstruction.textContent = 'Hold still…';
      statusInstruction.className = 'status-instruction ready';

      autoCheckTimer = setTimeout(() => {
        if (!processing && !cooldown) executeCheckIn();
      }, 500);
    }
  } else {
    if (!cooldown && !processing) {
      camContainer.className = 'cam-container';
      faceReady = false;
      statusInstruction.textContent = 'Look at the camera';
      statusInstruction.className = 'status-instruction';
      if (autoCheckTimer) clearTimeout(autoCheckTimer);
    }
  }
  requestAnimationFrame(detectLoop);
}

function executeCheckIn() {
  if (processing || cooldown) return;
  processing = true;
  cooldown = true;

  const canvas = capture;
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);

  canvas.toBlob(async (blob) => {
    const formData = new FormData();
    formData.append('photo', blob, 'kiosk.jpg');
    formData.append('latitude', currentPosition.latitude);
    formData.append('longitude', currentPosition.longitude);

    try {
      const resp = await fetch(`${API_BASE}/attendance/check-in`, {
        method: 'POST',
        body: formData,
      });

      if (!resp.ok) {
        let errText = 'Verification failed';
        try {
          const errData = await resp.json();
          errText = errData.detail || errText;
        } catch (e) {}
        throw new Error(errText);
      }

      const data = await resp.json();
      showResult(true, data.worker_name, data.event_type, data.minutes_late);
    } catch (err) {
      showResult(false, null, null, null, err.message);
    }
  }, 'image/jpeg', 0.92);
}

function showResult(success, workerName, eventType, minutesLate, errorMsg) {
  const nowStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

  if (success) {
    camContainer.className = 'cam-container recognized';
    resultIcon.className = 'result-icon success';
    resultIcon.textContent = '✓';
    const firstName = (workerName || 'Worker').split(' ')[0];
    resultTitle.textContent = `Checked in, ${firstName}`;
    resultTime.textContent = nowStr;
    resultSub.textContent = minutesLate > 0 ? `${minutesLate}m late` : 'Have a good shift';
    statusInstruction.textContent = `Check-in verified`;
    statusInstruction.className = 'status-instruction ready';
  } else {
    camContainer.className = 'cam-container rejected';
    resultIcon.className = 'result-icon fail';
    resultIcon.textContent = '!';
    resultTitle.textContent = "Couldn't verify";
    resultTime.textContent = '';
    resultSub.textContent = 'Try again or use Employee ID';
    statusInstruction.textContent = errorMsg || 'Verification fail';
    statusInstruction.className = 'status-instruction error';
  }

  resultCard.classList.add('active');

  setTimeout(() => {
    resultCard.classList.remove('active');
    camContainer.className = 'cam-container';
    processing = false;
    faceReady = false;

    setTimeout(() => {
      cooldown = false;
      statusInstruction.textContent = 'Look at the camera';
      statusInstruction.className = 'status-instruction';
    }, 1200);
  }, 2200);
}
</script>
</body>
</html>
