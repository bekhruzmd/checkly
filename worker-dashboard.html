<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkly — My Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#181511">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #181511;
    --surface: #211E19;
    --raised:  #2B2720;
    --border:  #3A3530;
    --text:    #D8E0EA;
    --muted:   #636D7E;
    --accent:  #5496D8;
    --fee:     #C98A28;
    --fail:    #D05448;
    --pass:    #3C9E6F;

    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body:    'IBM Plex Sans', system-ui, sans-serif;
    --font-mono:    'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh; padding-bottom: 40px;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .back-btn {
    font-size: 14px; color: var(--accent); text-decoration: none; font-weight: 500;
    font-family: var(--font-body);
    display: flex; align-items: center; gap: 6px;
  }
  .header-title { font-size: 15px; font-weight: 600; font-family: var(--font-display); }
  .header-date { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }

  /* ── Main layout ── */
  .container {
    max-width: 640px; margin: 0 auto;
    padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;
  }
  @media (min-width: 768px) { .container { padding: 32px 24px; gap: 20px; } }
  @media (min-width: 1024px) { .container { max-width: 800px; } }

  /* ── Greeting ── */
  .greeting { padding: 4px 0; }
  .greeting-name { font-size: 22px; font-weight: 700; font-family: var(--font-display); letter-spacing: -0.02em; }
  .greeting-sub { font-size: 14px; color: var(--muted); margin-top: 3px; font-family: var(--font-mono); }
  @media (min-width: 768px) { .greeting-name { font-size: 26px; } }

  /* ── Cards ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .card-header {
    padding: 14px 18px 0; font-size: 11px; font-weight: 500;
    letter-spacing: 0.07em; color: var(--muted); text-transform: uppercase;
    font-family: var(--font-body);
  }
  .card-body { padding: 14px 18px 18px; }

  /* ── Today timeline ── */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl-row {
    display: flex; align-items: center; gap: 14px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .tl-row:last-child { border-bottom: none; }
  .tl-dot {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .tl-dot.done { background: rgba(60,158,111,.2); color: var(--pass); }
  .tl-dot.pending { background: rgba(99,109,126,.12); color: var(--muted); }
  .tl-dot.late-dot { background: rgba(208,84,72,.15); color: var(--fail); }
  .tl-label { font-size: 13px; color: var(--muted); font-family: var(--font-body); }
  .tl-value { font-size: 16px; font-weight: 600; margin-top: 1px; font-family: var(--font-mono); }
  .tl-meta { margin-left: auto; text-align: right; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 500;
  }
  .badge-ontime { background: rgba(60,158,111,.14); color: var(--pass); }
  .badge-late   { background: rgba(208,84,72,.14);  color: var(--fail); }
  .badge-pending{ background: rgba(99,109,126,.12); color: var(--muted); }

  .fee-row {
    margin-top: 12px; padding: 10px 14px;
    background: rgba(201,138,40,.08); border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: var(--muted);
  }
  .fee-row strong { color: var(--fee); font-size: 16px; font-family: var(--font-mono); }

  /* ── Progress bar ── */
  .shift-progress { margin-top: 14px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill  { height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s; }

  /* ── Week table ── */
  .week-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .week-table th {
    text-align: left; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 0; font-weight: 500;
    font-family: var(--font-body);
  }
  .week-table td { padding: 9px 0; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 13px; }
  .week-table td:last-child { text-align: right; }
  .today-row-week { font-weight: 500; color: var(--text); }

  /* ── Two-column on tablet+ ── */
  .two-col { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .two-col { grid-template-columns: 1fr 1fr; gap: 20px; } }

  /* ── Action button ── */
  .btn-checkout {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    color: var(--text); font-family: var(--font-display);
    cursor: pointer; transition: background .15s;
  }
  .btn-checkout:hover { background: var(--raised); }
  .btn-checkout.checkin-mode { background: var(--accent); color: #fff; border-color: transparent; }
</style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
    Check In/Out
  </a>
  <span class="header-title">My Attendance</span>
  <span class="header-date" id="todayDate"></span>
</header>

<div class="container">

  <div class="greeting">
    <div class="greeting-name" id="greetingText">Good morning, Alisher</div>
    <div class="greeting-sub" id="shiftLabel">Morning shift · 09:00 – 17:00</div>
  </div>

  <!-- Today -->
  <div class="card">
    <div class="card-header">Today</div>
    <div class="card-body">
      <div class="timeline">
        <div class="tl-row">
          <div class="tl-dot done" id="checkinDot">✓</div>
          <div>
            <div class="tl-label">Checked in</div>
            <div class="tl-value" id="checkinTime">09:02</div>
          </div>
          <div class="tl-meta">
            <span class="badge badge-ontime" id="checkinBadge">On time</span>
          </div>
        </div>
        <div class="tl-row">
          <div class="tl-dot pending" id="checkoutDot">○</div>
          <div>
            <div class="tl-label">Check out</div>
            <div class="tl-value" id="checkoutTime">—</div>
          </div>
          <div class="tl-meta">
            <span class="badge badge-pending" id="checkoutBadge">Pending</span>
          </div>
        </div>
      </div>
      <div class="fee-row" id="feeRow" style="display:none">
        Late fee applied <strong id="feeAmount">$0.00</strong>
      </div>
      <div class="shift-progress" id="progressWrap">
        <div class="progress-label">
          <span>09:00 shift start</span>
          <span id="progressPct">—</span>
          <span>17:00 end</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- Stats + week -->
  <div class="two-col">
    <div class="card">
      <div class="card-header">This Month</div>
      <div class="card-body">
        <div style="display:flex;gap:20px;flex-wrap:wrap">
          <div>
            <div style="font-size:28px;font-weight:700;color:var(--pass);font-family:var(--font-display)" id="statOnTime">18</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">On time</div>
          </div>
          <div>
            <div style="font-size:28px;font-weight:700;color:var(--fail);font-family:var(--font-display)" id="statLate">2</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">Late</div>
          </div>
          <div>
            <div style="font-size:28px;font-weight:700;font-family:var(--font-mono)" id="statFees">$9.00</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">Total fees</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">This Week</div>
      <div class="card-body" style="padding-top:10px">
        <table class="week-table">
          <tbody id="weekBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <button class="btn-checkout" id="actionBtn" onclick="goCheckIn()">Check Out →</button>

</div>

<script>
const WEEK = [
  { day: 'Mon', date: '21', in: '09:00', late: 0,  status: 'ontime' },
  { day: 'Tue', date: '22', in: '09:14', late: 9,  status: 'late'   },
  { day: 'Wed', date: '23', in: '09:01', late: 0,  status: 'ontime' },
  { day: 'Thu', date: '24', in: '09:00', late: 0,  status: 'ontime' },
  { day: 'Fri', date: '25', in: '09:00', late: 0,  status: 'ontime' },
  { day: 'Sat', date: '26', in: '—',    late: null, status: 'today' },
];

// Read data passed from check-in page
const saved = JSON.parse(sessionStorage.getItem('checklyWorker') || 'null');
const data = saved || {
  worker_name: 'Alisher Nazarov',
  event_type: 'check_in',
  minutes_late: 0,
  fee_charged: 0,
  checkin_time: '09:02',
  checkout_time: null,
};

// Greeting
const hour = new Date().getHours();
const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
const firstName = (data.worker_name || 'Worker').split(' ')[0];
document.getElementById('greetingText').textContent = `${greet}, ${firstName}`;

// Date
const now = new Date();
document.getElementById('todayDate').textContent = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

// Check-in row
if (data.checkin_time) {
  document.getElementById('checkinTime').textContent = data.checkin_time;
  if (data.minutes_late > 0) {
    document.getElementById('checkinBadge').textContent = `${data.minutes_late} min late`;
    document.getElementById('checkinBadge').className = 'badge badge-late';
    document.getElementById('checkinDot').className = 'tl-dot late-dot';
    document.getElementById('checkinDot').textContent = '!';
    if (data.fee_charged > 0) {
      document.getElementById('feeRow').style.display = 'flex';
      document.getElementById('feeAmount').textContent = `$${parseFloat(data.fee_charged).toFixed(2)}`;
    }
  }
}

// Check-out row
if (data.event_type === 'check_out' && data.checkout_time) {
  document.getElementById('checkoutTime').textContent = data.checkout_time;
  document.getElementById('checkoutDot').className = 'tl-dot done';
  document.getElementById('checkoutDot').textContent = '✓';
  document.getElementById('checkoutBadge').textContent = 'Done';
  document.getElementById('checkoutBadge').className = 'badge badge-ontime';
  document.getElementById('actionBtn').textContent = '← Check In Again';
  document.getElementById('actionBtn').classList.add('checkin-mode');
  document.getElementById('progressWrap').style.display = 'none';
}

// Shift progress (morning shift 09:00–17:00)
const shiftStart = new Date(); shiftStart.setHours(9, 0, 0, 0);
const shiftEnd   = new Date(); shiftEnd.setHours(17, 0, 0, 0);
const elapsed = Math.max(0, Math.min(now - shiftStart, shiftEnd - shiftStart));
const pct = Math.round((elapsed / (shiftEnd - shiftStart)) * 100);
document.getElementById('progressFill').style.width = pct + '%';
document.getElementById('progressPct').textContent = pct + '% through';

// Week table
const wb = document.getElementById('weekBody');
wb.innerHTML = WEEK.map(r => {
  const isToday = r.status === 'today';
  const badge = isToday
    ? `<span class="badge badge-pending">Today</span>`
    : r.status === 'late'
      ? `<span class="badge badge-late">+${r.late}m</span>`
      : `<span class="badge badge-ontime">✓</span>`;
  return `<tr class="${isToday ? 'today-row-week' : ''}">
    <td style="color:var(--muted);width:36px">${r.day}</td>
    <td>${r.in}</td>
    <td>${badge}</td>
  </tr>`;
}).join('');

function goCheckIn() {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
