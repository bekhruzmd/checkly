<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkly — Worker Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0B0F17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F17;
    --bg-gradient: radial-gradient(circle at 50% -20%, #1e293b 0%, #0b0f17 80%);
    --surface: rgba(22, 27, 34, 0.75);
    --raised: rgba(30, 41, 59, 0.7);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --pass: #10b981;
    --pass-glow: rgba(16, 185, 129, 0.25);
    --fail: #ef4444;
    --fail-glow: rgba(239, 68, 68, 0.25);
    --warn: #f59e0b;

    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh; padding-bottom: 50px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Topbar Navigation ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: var(--surface);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .back-btn {
    font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600;
    font-family: var(--font-display);
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 8px;
    background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25);
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(59,130,246,0.2); }
  .header-title { font-size: 15px; font-weight: 700; font-family: var(--font-display); }
  .header-date { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }

  /* ── Layout Container ── */
  .container {
    max-width: 720px; margin: 0 auto;
    padding: 28px 20px; display: flex; flex-direction: column; gap: 20px;
  }

  /* ── Greeting ── */
  .greeting { display: flex; flex-direction: column; gap: 4px; }
  .greeting-name { font-size: 26px; font-weight: 800; font-family: var(--font-display); letter-spacing: -0.02em; }
  .greeting-sub { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card-header {
    padding: 16px 20px 0; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase;
    font-family: var(--font-display);
  }
  .card-body { padding: 16px 20px 20px; }

  /* ── Timeline ── */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl-row {
    display: flex; align-items: center; gap: 16px; padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .tl-row:last-child { border-bottom: none; }
  .tl-dot {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; flex-shrink: 0;
  }
  .tl-dot.done { background: rgba(16,185,129,0.15); color: var(--pass); border: 1px solid rgba(16,185,129,0.3); }
  .tl-dot.pending { background: rgba(148,163,184,0.1); color: var(--muted); border: 1px solid var(--border); }
  .tl-dot.late-dot { background: rgba(239,68,68,0.15); color: var(--fail); border: 1px solid rgba(239,68,68,0.3); }

  .tl-label { font-size: 12px; color: var(--muted); }
  .tl-value { font-size: 16px; font-weight: 700; margin-top: 2px; font-family: var(--font-mono); }
  .tl-meta { margin-left: auto; text-align: right; }

  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .badge-ontime { background: rgba(16,185,129,0.15); color: var(--pass); border: 1px solid rgba(16,185,129,0.3); }
  .badge-late   { background: rgba(239,68,68,0.15);  color: var(--fail); border: 1px solid rgba(239,68,68,0.3); }
  .badge-pending{ background: rgba(148,163,184,0.1); color: var(--muted); border: 1px solid var(--border); }

  .fee-row {
    margin-top: 14px; padding: 12px 16px;
    background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3);
    border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--warn);
  }
  .fee-row strong { color: var(--warn); font-size: 16px; font-family: var(--font-mono); }

  /* ── Progress Track ── */
  .shift-progress { margin-top: 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; font-family: var(--font-mono); }
  .progress-track { height: 8px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill  { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 4px; transition: width .5s; }

  /* ── Week Table ── */
  .week-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .week-table th {
    text-align: left; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 0; font-weight: 600;
  }
  .week-table td { padding: 11px 0; border-top: 1px solid var(--border); font-family: var(--font-mono); }
  .week-table td:last-child { text-align: right; }
  .today-row-week { font-weight: 700; color: var(--text); }

  /* ── Two Column ── */
  .two-col { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .two-col { grid-template-columns: 1fr 1fr; gap: 20px; } }

  /* ── Checkout Button ── */
  .btn-checkout {
    width: 100%; padding: 16px; font-size: 15px; font-weight: 700;
    border: 1px solid var(--border-strong); border-radius: 14px;
    background: var(--surface); color: var(--text);
    font-family: var(--font-display); cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  .btn-checkout:hover { background: rgba(30, 41, 59, 0.9); transform: translateY(-1px); }
  .btn-checkout.checkin-mode {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 20px var(--accent-glow);
  }
</style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
    Kiosk Check In
  </a>
  <span class="header-title">My Attendance</span>
  <span class="header-date" id="todayDate"></span>
</header>

<div class="container">

  <div class="greeting">
    <div class="greeting-name" id="greetingText">Good morning, Alisher</div>
    <div class="greeting-sub" id="shiftLabel">Morning shift · 09:00 – 17:00</div>
  </div>

  <!-- Today card -->
  <div class="card">
    <div class="card-header">Today's Shift Activity</div>
    <div class="card-body">
      <div class="timeline">
        <div class="tl-row">
          <div class="tl-dot done" id="checkinDot">✓</div>
          <div>
            <div class="tl-label">Check In Time</div>
            <div class="tl-value" id="checkinTime">09:02</div>
          </div>
          <div class="tl-meta">
            <span class="badge badge-ontime" id="checkinBadge">On Time</span>
          </div>
        </div>
        <div class="tl-row">
          <div class="tl-dot pending" id="checkoutDot">○</div>
          <div>
            <div class="tl-label">Check Out Time</div>
            <div class="tl-value" id="checkoutTime">—</div>
          </div>
          <div class="tl-meta">
            <span class="badge badge-pending" id="checkoutBadge">Pending</span>
          </div>
        </div>
      </div>

      <div class="fee-row" id="feeRow" style="display:none">
        Late Penalty Applied <strong id="feeAmount">$0.00</strong>
      </div>

      <div class="shift-progress" id="progressWrap">
        <div class="progress-label">
          <span>09:00 Shift Start</span>
          <span id="progressPct">0%</span>
          <span>17:00 Shift End</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- Stats & Week -->
  <div class="two-col">
    <div class="card">
      <div class="card-header">Monthly Attendance</div>
      <div class="card-body">
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          <div>
            <div style="font-size:30px;font-weight:800;color:var(--pass);font-family:var(--font-display)" id="statOnTime">18</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">On time</div>
          </div>
          <div>
            <div style="font-size:30px;font-weight:800;color:var(--fail);font-family:var(--font-display)" id="statLate">2</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">Late</div>
          </div>
          <div>
            <div style="font-size:30px;font-weight:800;font-family:var(--font-mono)" id="statFees">$9.00</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">Total fees</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Weekly History</div>
      <div class="card-body" style="padding-top:10px">
        <table class="week-table">
          <tbody id="weekBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <button class="btn-checkout" id="actionBtn" onclick="goCheckIn()">Check Out →</button>

</div>

<script>
const WEEK = [
  { day: 'Mon', date: '21', in: '09:00', late: 0,  status: 'ontime' },
  { day: 'Tue', date: '22', in: '09:14', late: 9,  status: 'late'   },
  { day: 'Wed', date: '23', in: '09:01', late: 0,  status: 'ontime' },
  { day: 'Thu', date: '24', in: '09:00', late: 0,  status: 'ontime' },
  { day: 'Fri', date: '25', in: '09:00', late: 0,  status: 'ontime' },
  { day: 'Sat', date: '26', in: '—',    late: null, status: 'today' },
];

const saved = JSON.parse(sessionStorage.getItem('checklyWorker') || 'null');
const data = saved || {
  worker_name: 'Alisher Nazarov',
  event_type: 'check_in',
  minutes_late: 0,
  fee_charged: 0,
  checkin_time: '09:02',
  checkout_time: null,
};

const hour = new Date().getHours();
const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
const firstName = (data.worker_name || 'Worker').split(' ')[0];
document.getElementById('greetingText').textContent = `${greet}, ${firstName}`;

const now = new Date();
document.getElementById('todayDate').textContent = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

if (data.checkin_time) {
  document.getElementById('checkinTime').textContent = data.checkin_time;
  if (data.minutes_late > 0) {
    document.getElementById('checkinBadge').textContent = `${data.minutes_late}m Late`;
    document.getElementById('checkinBadge').className = 'badge badge-late';
    document.getElementById('checkinDot').className = 'tl-dot late-dot';
    document.getElementById('checkinDot').textContent = '!';
    if (data.fee_charged > 0) {
      document.getElementById('feeRow').style.display = 'flex';
      document.getElementById('feeAmount').textContent = `$${parseFloat(data.fee_charged).toFixed(2)}`;
    }
  }
}

if (data.event_type === 'check_out' && data.checkout_time) {
  document.getElementById('checkoutTime').textContent = data.checkout_time;
  document.getElementById('checkoutDot').className = 'tl-dot done';
  document.getElementById('checkoutDot').textContent = '✓';
  document.getElementById('checkoutBadge').textContent = 'Completed';
  document.getElementById('checkoutBadge').className = 'badge badge-ontime';
  document.getElementById('actionBtn').textContent = '← Check In Again';
  document.getElementById('actionBtn').classList.add('checkin-mode');
  document.getElementById('progressWrap').style.display = 'none';
}

const shiftStart = new Date(); shiftStart.setHours(9, 0, 0, 0);
const shiftEnd   = new Date(); shiftEnd.setHours(17, 0, 0, 0);
const elapsed = Math.max(0, Math.min(now - shiftStart, shiftEnd - shiftStart));
const pct = Math.round((elapsed / (shiftEnd - shiftStart)) * 100);
document.getElementById('progressFill').style.width = pct + '%';
document.getElementById('progressPct').textContent = pct + '% through shift';

const wb = document.getElementById('weekBody');
wb.innerHTML = WEEK.map(r => {
  const isToday = r.status === 'today';
  const badge = isToday
    ? `<span class="badge badge-pending">Today</span>`
    : r.status === 'late'
      ? `<span class="badge badge-late">+${r.late}m</span>`
      : `<span class="badge badge-ontime">✓</span>`;
  return `<tr class="${isToday ? 'today-row-week' : ''}">
    <td style="color:var(--muted);width:40px">${r.day}</td>
    <td>${r.in}</td>
    <td>${badge}</td>
  </tr>`;
}).join('');

function goCheckIn() {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
